version: '3.8'

networks:
  caddy_global_net:
    external: true

services:
  db:
    image: postgres:16-alpine
    container_name: tearweb_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tearweb_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caddy_global_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tearweb_api
    restart: always
    environment:
      PORT: 3001
      RESEND_API_KEY: ${RESEND_API_KEY}
      DESTINO_EMAIL: ${DESTINO_EMAIL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_123}@db:5432/${POSTGRES_DB:-tearweb_db}
    depends_on:
      - db
    networks:
      - caddy_global_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tearweb_web
    restart: always
    depends_on:
      - api
    networks:
      - caddy_global_net

volumes:
  postgres_data:

